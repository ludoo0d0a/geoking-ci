name: Android CI (reusable)

on:
  workflow_call:
    inputs:
      gradle_module:
        description: 'Gradle module path (e.g. :composeApp)'
        type: string
        default: ':composeApp'
      assemble_task:
        description: 'Gradle assemble task suffix (Debug/Release)'
        type: string
        default: 'Debug'
      apk_glob:
        description: 'APK artifact glob relative to repo root'
        type: string
        default: 'composeApp/build/outputs/apk/debug/*.apk'
      artifact_name:
        description: 'Uploaded artifact name'
        type: string
        required: true
      google_services_path:
        description: 'Path to decode google-services.json into'
        type: string
        default: 'composeApp/google-services.json'
      geoking_ci_repo:
        description: 'geoking-ci repository (owner/name)'
        type: string
        default: 'ludoo0d0a/geoking-ci'
      geoking_ci_ref:
        description: 'geoking-ci ref (branch/tag/sha)'
        type: string
        default: 'main'
      geoking_tools_repo:
        description: 'geoking-tools repository (owner/name) for includeBuild / scripts'
        type: string
        default: 'ludoo0d0a/geoking-tools'
      geoking_tools_ref:
        description: 'geoking-tools ref (branch/tag/sha)'
        type: string
        default: 'main'
      gradle_version:
        description: 'Gradle version for setup-gradle (wrapper = project gradle-wrapper.properties)'
        type: string
        default: 'wrapper'
      java_version:
        description: 'JDK version for setup-gradle action'
        type: string
        default: '21'

# allowOneBuildAtOnce / cancelPreviousRunningBuild: one run per repo+ref; newer cancels older.
concurrency:
  group: android-ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout geoking-ci
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.geoking_ci_repo }}
          ref: ${{ inputs.geoking_ci_ref }}
          path: geoking-ci

      - name: Checkout geoking-tools
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.geoking_tools_repo }}
          ref: ${{ inputs.geoking_tools_ref }}
          path: geoking-tools

      - name: Setup Gradle
        uses: ./geoking-ci/actions/setup-gradle
        with:
          gradle-version: ${{ inputs.gradle_version }}
          java-version: ${{ inputs.java_version }}

      - name: Decode google-services.json (Firebase)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: bash geoking-ci/scripts/write-google-services.sh "${{ inputs.google_services_path }}"

      - name: Assemble debug APK
        env:
          GK_TOOLS: ${{ github.workspace }}/geoking-tools
          WEB_CLIENT_ID: ${{ secrets.WEB_CLIENT_ID || secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID || secrets.WEB_CLIENT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          UNSPLASH_SECRET_KEY: ${{ secrets.UNSPLASH_SECRET_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
          EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
          HARVARD_API_KEY: ${{ secrets.HARVARD_API_KEY }}
          SMITHSONIAN_API_KEY: ${{ secrets.SMITHSONIAN_API_KEY }}
          DEBUG_DEV: ${{ secrets.DEBUG_DEV }}
          GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
          OPENCHARGEMAP_KEY: ${{ secrets.OPENCHARGEMAP_KEY }}
          MOBILITEIT_LUXEMBOURG_KEY: ${{ secrets.MOBILITEIT_LUXEMBOURG_KEY }}
          TOMTOM_KEY: ${{ secrets.TOMTOM_KEY }}
          CHARGY_API_KEY: ${{ secrets.CHARGY_API_KEY }}
          GERMANY_TANKERKOENIG_KEY: ${{ secrets.GERMANY_TANKERKOENIG_KEY }}
          FASTNED_UK_KEY: ${{ secrets.FASTNED_UK_KEY }}
          ROMANIA_PECO_APPLICATION_ID: ${{ secrets.ROMANIA_PECO_APPLICATION_ID }}
          ROMANIA_PECO_CLIENT_KEY: ${{ secrets.ROMANIA_PECO_CLIENT_KEY }}
          DKV_SUBSCRIPTION_KEY: ${{ secrets.DKV_SUBSCRIPTION_KEY }}
          DKV_AUTHORIZATION: ${{ secrets.DKV_AUTHORIZATION }}
          ECO_MOVEMENT_KEY: ${{ secrets.ECO_MOVEMENT_KEY }}
          FUELPRICES_DK_KEY: ${{ secrets.FUELPRICES_DK_KEY }}
          NSW_FUELCHECK_KEY: ${{ secrets.NSW_FUELCHECK_KEY }}
          NSW_FUELCHECK_SECRET: ${{ secrets.NSW_FUELCHECK_SECRET }}
        run: ./gradlew ${{ inputs.gradle_module }}:assemble${{ inputs.assemble_task }} --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.apk_glob }}
          if-no-files-found: warn
