name: Release to Play Store (reusable)

on:
  workflow_call:
    inputs:
      package_name:
        description: 'Android applicationId / Play package name'
        type: string
        required: true
      gradle_module:
        description: 'Gradle module path (e.g. :composeApp)'
        type: string
        default: ':composeApp'
      bundle_task:
        description: 'Gradle bundle task name (e.g. bundleRelease or bundlePlaystoreRelease)'
        type: string
        default: 'bundleRelease'
      aab_glob:
        description: 'AAB path glob relative to repo root'
        type: string
        default: 'composeApp/build/outputs/bundle/release/composeApp-release.aab'
      google_services_path:
        description: 'Path to decode google-services.json into'
        type: string
        default: 'composeApp/google-services.json'
      whatsnew_script:
        description: 'Path to whatsnew.py (project wrapper or geoking-tools)'
        type: string
        default: 'scripts/whatsnew.py'
      default_track:
        description: 'Default Play track when not dispatching'
        type: string
        default: 'internal'
      geoking_ci_repo:
        description: 'geoking-ci repository (owner/name)'
        type: string
        default: 'ludoo0d0a/geoking-ci'
      geoking_ci_ref:
        description: 'geoking-ci ref'
        type: string
        default: 'main'
      geoking_tools_repo:
        description: 'geoking-tools repository (owner/name) for whatsnew.py'
        type: string
        default: 'ludoo0d0a/geoking-tools'
      geoking_tools_ref:
        description: 'geoking-tools ref'
        type: string
        default: 'main'
      gradle_version:
        description: 'Gradle version (wrapper = project gradle-wrapper.properties)'
        type: string
        default: 'wrapper'
      java_version:
        description: 'JDK version'
        type: string
        default: '21'
      workflow_dispatch_track:
        description: 'Track from workflow_dispatch (empty if push/tag)'
        type: string
        default: ''
      workflow_dispatch_skip_review:
        description: 'changesNotSentForReview from workflow_dispatch'
        type: string
        default: 'false'
      is_workflow_dispatch:
        description: 'Whether the caller run was workflow_dispatch'
        type: string
        default: 'false'
      version_name_override:
        description: 'VERSION_NAME env for Gradle (empty = playstore/version.properties)'
        type: string
        default: ''
      version_code_override:
        description: 'VERSION_CODE env for Gradle (empty = github.run_number)'
        type: string
        default: ''
      unit_test_tasks:
        description: >-
          Space-separated Gradle unit-test tasks. Empty = ${gradle_module}:testDebugUnitTest.
          Set skip_unit_tests=true to skip entirely.
        type: string
        default: ''
      skip_unit_tests:
        description: 'Skip unit tests (build + Play only)'
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Canonical geoking names, with legacy Gaston aliases.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.SIGNING_KEY }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.KEY_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON || secrets.SERVICE_ACCOUNT_JSON }}
      WEB_CLIENT_ID: ${{ secrets.WEB_CLIENT_ID || secrets.GOOGLE_WEB_CLIENT_ID }}
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID || secrets.WEB_CLIENT_ID }}
      VERSION_CODE: ${{ inputs.version_code_override != '' && inputs.version_code_override || github.run_number }}
      VERSION_NAME: ${{ inputs.version_name_override }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout geoking-ci
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.geoking_ci_repo }}
          ref: ${{ inputs.geoking_ci_ref }}
          path: geoking-ci

      - name: Checkout geoking-tools
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.geoking_tools_repo }}
          ref: ${{ inputs.geoking_tools_ref }}
          path: geoking-tools

      - name: Setup Gradle
        uses: ./geoking-ci/actions/setup-gradle
        with:
          gradle-version: ${{ inputs.gradle_version }}
          java-version: ${{ inputs.java_version }}

      - name: Decode google-services.json (Firebase)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: bash geoking-ci/scripts/write-google-services.sh "${{ inputs.google_services_path }}"

      - name: Unit tests
        if: ${{ inputs.skip_unit_tests != true }}
        env:
          GK_TOOLS: ${{ github.workspace }}/geoking-tools
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          UNSPLASH_SECRET_KEY: ${{ secrets.UNSPLASH_SECRET_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
          EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
          HARVARD_API_KEY: ${{ secrets.HARVARD_API_KEY }}
          SMITHSONIAN_API_KEY: ${{ secrets.SMITHSONIAN_API_KEY }}
          DEBUG_DEV: ${{ secrets.DEBUG_DEV }}
          GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
          OPENCHARGEMAP_KEY: ${{ secrets.OPENCHARGEMAP_KEY }}
          MOBILITEIT_LUXEMBOURG_KEY: ${{ secrets.MOBILITEIT_LUXEMBOURG_KEY }}
          TOMTOM_KEY: ${{ secrets.TOMTOM_KEY }}
          CHARGY_API_KEY: ${{ secrets.CHARGY_API_KEY }}
          GERMANY_TANKERKOENIG_KEY: ${{ secrets.GERMANY_TANKERKOENIG_KEY }}
          FASTNED_UK_KEY: ${{ secrets.FASTNED_UK_KEY }}
          ROMANIA_PECO_APPLICATION_ID: ${{ secrets.ROMANIA_PECO_APPLICATION_ID }}
          ROMANIA_PECO_CLIENT_KEY: ${{ secrets.ROMANIA_PECO_CLIENT_KEY }}
          DKV_SUBSCRIPTION_KEY: ${{ secrets.DKV_SUBSCRIPTION_KEY }}
          DKV_AUTHORIZATION: ${{ secrets.DKV_AUTHORIZATION }}
          ECO_MOVEMENT_KEY: ${{ secrets.ECO_MOVEMENT_KEY }}
          FUELPRICES_DK_KEY: ${{ secrets.FUELPRICES_DK_KEY }}
          NSW_FUELCHECK_KEY: ${{ secrets.NSW_FUELCHECK_KEY }}
          NSW_FUELCHECK_SECRET: ${{ secrets.NSW_FUELCHECK_SECRET }}
        run: |
          TASKS="${{ inputs.unit_test_tasks }}"
          if [ -z "$TASKS" ]; then
            TASKS="${{ inputs.gradle_module }}:testDebugUnitTest"
          fi
          echo "Running unit tests: $TASKS"
          ./gradlew $TASKS --no-daemon --stacktrace

      - name: Decode signing keystore
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::KEYSTORE_BASE64 / SIGNING_KEY secret missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | tr -d '\n' | base64 --decode > "$RUNNER_TEMP/release.keystore"
          [ -s "$RUNNER_TEMP/release.keystore" ] || { echo "::error::Keystore decode produced empty file"; exit 1; }

      - name: Print upload-key SHA-1 (OAuth Android client)
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
        run: |
          SHA1="$(keytool -list -v -keystore "$KEYSTORE_FILE" -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" \
            | awk -F'SHA1: ' '/SHA1:/{print $2; exit}')"
          echo "Upload-key SHA-1 (add to OAuth Android client if missing): $SHA1"

      - name: Build signed AAB
        env:
          GK_TOOLS: ${{ github.workspace }}/geoking-tools
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          UNSPLASH_SECRET_KEY: ${{ secrets.UNSPLASH_SECRET_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
          EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
          HARVARD_API_KEY: ${{ secrets.HARVARD_API_KEY }}
          SMITHSONIAN_API_KEY: ${{ secrets.SMITHSONIAN_API_KEY }}
          DEBUG_DEV: ${{ secrets.DEBUG_DEV }}
          GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
          OPENCHARGEMAP_KEY: ${{ secrets.OPENCHARGEMAP_KEY }}
          MOBILITEIT_LUXEMBOURG_KEY: ${{ secrets.MOBILITEIT_LUXEMBOURG_KEY }}
          TOMTOM_KEY: ${{ secrets.TOMTOM_KEY }}
          CHARGY_API_KEY: ${{ secrets.CHARGY_API_KEY }}
          GERMANY_TANKERKOENIG_KEY: ${{ secrets.GERMANY_TANKERKOENIG_KEY }}
          FASTNED_UK_KEY: ${{ secrets.FASTNED_UK_KEY }}
          ROMANIA_PECO_APPLICATION_ID: ${{ secrets.ROMANIA_PECO_APPLICATION_ID }}
          ROMANIA_PECO_CLIENT_KEY: ${{ secrets.ROMANIA_PECO_CLIENT_KEY }}
          DKV_SUBSCRIPTION_KEY: ${{ secrets.DKV_SUBSCRIPTION_KEY }}
          DKV_AUTHORIZATION: ${{ secrets.DKV_AUTHORIZATION }}
          ECO_MOVEMENT_KEY: ${{ secrets.ECO_MOVEMENT_KEY }}
          FUELPRICES_DK_KEY: ${{ secrets.FUELPRICES_DK_KEY }}
          NSW_FUELCHECK_KEY: ${{ secrets.NSW_FUELCHECK_KEY }}
          NSW_FUELCHECK_SECRET: ${{ secrets.NSW_FUELCHECK_SECRET }}
        run: |
          echo "Building versionCode=${VERSION_CODE} versionName=${VERSION_NAME:-(from version.properties)}"
          ./gradlew ${{ inputs.gradle_module }}:${{ inputs.bundle_task }} --no-daemon --stacktrace

      - name: Build summary
        if: always()
        env:
          TRACK: ${{ inputs.workflow_dispatch_track || inputs.default_track }}
        run: |
          VN="${VERSION_NAME:-}"
          if [ -z "$VN" ] && [ -f playstore/version.properties ]; then
            VN="$(grep '^versionName=' playstore/version.properties | cut -d= -f2-) (from version.properties)"
          fi
          {
            echo "### Release build"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Package | \`${{ inputs.package_name }}\` |"
            echo "| versionCode | \`${VERSION_CODE}\` |"
            echo "| versionName | \`${VN:-?}\` |"
            echo "| Track | \`${TRACK}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate Play release notes
        env:
          GK_PROJECT_ROOT: ${{ github.workspace }}
          GK_TOOLS: ${{ github.workspace }}/geoking-tools
        run: |
          if [ -f "${{ inputs.whatsnew_script }}" ]; then
            python3 "${{ inputs.whatsnew_script }}" "$VERSION_CODE"
          else
            mkdir -p playstore/whatsnew
            echo "Build ${VERSION_CODE}" > playstore/whatsnew/whatsnew-en-US
          fi

      - name: Upload to Google Play (skip review)
        if: inputs.is_workflow_dispatch == 'true' && inputs.workflow_dispatch_skip_review == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ env.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ inputs.package_name }}
          releaseFiles: ${{ inputs.aab_glob }}
          whatsNewDirectory: playstore/whatsnew
          tracks: ${{ inputs.workflow_dispatch_track || inputs.default_track }}
          status: completed
          changesNotSentForReview: true

      - name: Upload to Google Play
        if: inputs.is_workflow_dispatch != 'true' || inputs.workflow_dispatch_skip_review != 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ env.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ inputs.package_name }}
          releaseFiles: ${{ inputs.aab_glob }}
          whatsNewDirectory: playstore/whatsnew
          tracks: ${{ inputs.workflow_dispatch_track || inputs.default_track }}
          status: completed
