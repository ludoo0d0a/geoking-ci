name: 'Setup Gradle'
description: 'Set up Temurin JDK and Gradle (with caching) for KMP/Android builds'

inputs:
  java-version:
    description: 'JDK version for the build'
    required: false
    default: '21'
  gradle-version:
    description: 'Gradle version when wrapper jar is not committed'
    required: false
    default: 'wrapper'

# Composite action — per the Kotlin Multiplatform GitHub Actions guide:
# https://kotlinlang.org/docs/multiplatform/github-actions-for-kmp.html
runs:
  using: 'composite'
  steps:
    # Ubuntu 26 (ubuntu-latest rollout) mounts /tmp as a ~7.8G tmpfs. Gradle
    # Android builds exceed that quota; keep temp files on the runner disk.
    - name: Point temp dirs at runner disk
      shell: bash
      run: |
        echo "TMPDIR=${RUNNER_TEMP}" >> "$GITHUB_ENV"
        echo "GRADLE_OPTS=-Djava.io.tmpdir=${RUNNER_TEMP} ${GRADLE_OPTS:-}" >> "$GITHUB_ENV"

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ inputs.java-version }}

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: ${{ inputs.gradle-version }}
